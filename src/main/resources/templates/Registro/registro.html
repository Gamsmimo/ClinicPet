<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Registro Compacto</title>
	<link rel="stylesheet" th:href="@{/assets/CSS/Estilos-registro.css}">
	<link rel="icon" th:href="@{/assets/IMG/logo.png}" type="image/png">
</head>

<body>
	<div class="background-container">
		<img th:src="@{/assets/IMG/img3.jpeg}" alt="Fondo decorativo" class="background-image" />
	</div>
	<div class="blur-container">
		<h2 class="form-title">Crear Cuenta</h2>
		<form action="/usuarios/registro" method="post">
			<div class="form-group">
				<label for="nombres">Nombres</label>
				<input type="text" id="nombres" name="nombres" required />
			</div>

			<div class="form-group">
				<label for="apellidos">Apellidos</label>
				<input type="text" id="apellidos" name="apellidos" required />
			</div>

			<div class="form-group">
				<label for="correo">Correo</label>
				<input type="email" id="correo" name="correo" required />
			</div>

			<div class="form-group">
				<label for="tipoDocumento">Tipo de Documento</label>
				<input type="text" id="tipoDocumento" name="tipoDocumento" required />
			</div>

			<div class="form-group">
				<label for="numDocumento">N° Documento</label>
				<input type="text" id="numDocumento" name="numDocumento" required />
			</div>

			<div class="form-group">
				<label for="telefono">Teléfono</label>
				<input type="tel" id="telefono" name="telefono" required />
			</div>

			<div class="form-group">
				<label for="telefono">Direccion</label>
				<input type="text" id="direccion" name="direccion" required />
			</div>

			<div class="form-group">
				<label for="edad">Edad</label>
				<input type="number" id="edad" name="edad" required min="0" />
			</div>

			<div class="form-group">
				<label for="password">Contraseña</label>
				<input type="password" id="password" name="password" required />
			</div>

			<div class="form-group">
				<label for="confirmPassword">Confirmar Contraseña</label>
				<input type="password" id="confirmPassword" name="confirmPassword" required />
			</div>

			<button type="submit" class="btn-register">Registrarse</button>
		</form>

	</div>
</body>

</html>
